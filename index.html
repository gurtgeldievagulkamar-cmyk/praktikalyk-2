<!DOCTYPE html>

<html lang="kk">

<head>

    <meta charset="UTF-8">

    <title>Студенттер туралы ақпарат</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h1>Студенттер туралы ақпарат</h1>

    <p>Практикалық жұмыс №2</p>

</header>

<main>

<section>

    <h2>Студенттердің мәліметтер кестесі</h2>

    <table>

        <tr>

            <th>№</th>

            <th>Аты-жөні</th>

            <th>Мамандығы</th>

            <th>Курсы</th>

        </tr>

        <tr>

            <td>1</td>

            <td>Айдана</td>

            <td>Биология</td>

            <td>1</td>

        </tr>

        <tr>

            <td>2</td>

            <td>Аружан</td>

            <td>Биотехнология</td>

            <td>2</td>

        </tr>

        <tr>

            <td>3</td>

            <td>Данияр</td>

            <td>Медицина</td>

            <td>3</td>

        </tr>

        <tr>

            <td>4</td>

            <td>Аяулым</td>

            <td>Биология</td>

            <td>4</td>

        </tr>

        <tr>

            <td colspan="4">

                Барлық студенттер саны: 4

            </td>

        </tr>

    </table>

</section>

<section>

    <h2>Студентті тіркеу формасы</h2>

    <form onsubmit="return false;">

        <label>Аты-жөніңіз:</label>

        <input type="text" placeholder="Аты-жөніңіз">

        <label>Құпиясөз:</label>

        <input type="password" placeholder="Құпиясөз">

        <label>Жынысы:</label>

        <div class="options">

            <label>

                <input type="radio" name="gender">

                Ер

            </label>

            <label>

                <input type="radio" name="gender">

                Әйел

            </label>

        </div>

        <label>Қызығушылықтарыңыз:</label>

        <div class="options">

            <label>

                <input type="checkbox">

                Биология

            </label>

            <label>

                <input type="checkbox">

                Химия

            </label>

            <label>

                <input type="checkbox">

                Медицина

            </label>

        </div>

        <label>Мамандығыңыз:</label>

        <select>

            <option>Биология</option>

            <option>Биотехнология</option>

            <option>Медицина</option>

            <option>Химия</option>

        </select>

        <label>Өзіңіз туралы ақпарат:</label>

        <textarea rows="5"

        placeholder="Мәлімет енгізіңіз"></textarea>

        <div class="buttons">

            <button type="submit">Жіберу</button>

            <button type="reset">Тазалау</button>

        </div>

    </form>

</section>

</main>

<footer>

    <p>Практикалық жұмыс №2 | HTML және CSS</p>

</footer>

</body>

</html>
